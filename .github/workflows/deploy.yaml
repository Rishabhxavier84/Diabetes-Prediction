name: check the code and deploy to docker hub

on: 
  push: 
    branches:
      - main
    # paths:
    #   - ./backend/Dockerfile
    #   - ./frontend/Dockerfile

jobs:
  deploy:
    runs-on: macOS-latest
    # strategy:
    #   matrix: 
    #     os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: build backend image
        run: docker build ./backend/ -t rishabhsaradigi/backend-diabetes:latest

      - name: build frontend image
        run: docker build ./frontend/ -t rishabhsaradigi/frontend-diabetes:latest

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: push image to dockerhub 
        run: |
          docker push rishabhsaradigi/backend-diabetes:latest
          docker push rishabhsaradigi/frontend-diabetes:latest

  deploy2:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: user/app:latest